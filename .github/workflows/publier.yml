# Publier un système (ADR 0140 d'ARRSA) : appelée par l'intégration continue du système, depuis
# son propre dépôt (privé). Construit son Flatpak et le pousse en image OCI privée sur
# ghcr.io/<propriétaire>/<paquet>:latest. Le système n'écrit rien dans ce dépôt-ci : le robot du
# catalogue (catalogue.yml) lit l'image et refait l'index ; aucune clé à créer ni à renouveler.
#
# Dans le dépôt du système :
#   jobs:
#     publier:
#       uses: Zelsher/arrsa-systemes/.github/workflows/publier.yml@main
#       permissions: { contents: write, packages: write }
#       with: { manifeste: paquet/org.arrsa.Atlas.yml, appli: org.arrsa.Atlas, paquet: systemes-atlas,
#               montee: "${{ inputs.montee || 'patch' }}" }
#
# Version (docs/systemes.md d'ARRSA, « Publier ») : lancée à la main (« Publier » du hangar, onglet
# Actions), la publication monte la version du metainfo (patch par défaut), la committe sur la branche
# et pose l'étiquette vX.Y.Z, puis publie cette étiquette ; partie d'une étiquette vX.Y.Z poussée, elle
# vérifie que le metainfo dit la même version. Une étiquette poussée avec le jeton du flux ne relance
# aucun flux (règle de GitHub) : pas de double publication. D'où contents: write.
#
# Après la première publication : dans les réglages du paquet, « Manage Actions access » →
# arrsa-systemes, rôle Read ; puis catalogue = true au registre d'ARRSA et systemes.toml régénéré.
name: Publier un système

on:
  workflow_call:
    inputs:
      manifeste:
        description: Manifeste flatpak-builder, chemin dans le dépôt du système
        required: true
        type: string
      appli:
        description: Identifiant Flatpak (org.arrsa.Atlas)
        required: true
        type: string
      paquet:
        description: Nom de l'image sur ghcr.io, sans le propriétaire (systemes-atlas)
        required: true
        type: string
      montee:
        description: "Publication à la main : patch, minor ou major"
        required: false
        type: string
        default: patch
      executeur:
        description: >-
          Où construire : l'étiquette du runner de la machine (vars.SYSTEME_RUNNER du dépôt, posée par
          « Brancher » du hangar d'ARRSA), sinon un exécuteur de GitHub (minutes payantes en dépôt privé)
        required: false
        type: string
        default: ubuntu-26.04
      branche:
        description: Branche Flatpak
        required: false
        type: string
        default: stable

jobs:
  version:
    runs-on: ${{ inputs.executeur || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      etiquette: ${{ steps.version.outputs.etiquette }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zelsher/arrsa-systemes
          ref: main
          path: .arrsa-systemes
      - id: version
        env:
          METAINFO: paquet/${{ inputs.appli }}.metainfo.xml
          MONTEE: ${{ inputs.montee }}
        run: |
          outil=.arrsa-systemes/outils/version.py
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(python3 "$outil" lire "$METAINFO")
            [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::étiquette $GITHUB_REF_NAME, metainfo $v : monter <release> avant d'étiqueter"; exit 1; }
          else
            v=$(python3 "$outil" monter "$METAINFO" "$MONTEE")
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              echo "::error::v$v existe déjà sans sa <release> sur $GITHUB_REF_NAME"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Version $v" -- "$METAINFO"
            git tag -a "v$v" -m "Version $v"
            git push -q origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$v"
          fi
          echo "etiquette=v$v" >> "$GITHUB_OUTPUT"
          echo "Version : v$v"

  publier:
    needs: version
    runs-on: ${{ inputs.executeur || 'ubuntu-26.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      MANIFESTE: ${{ inputs.manifeste }}
      APPLI: ${{ inputs.appli }}
      PAQUET: ${{ inputs.paquet }}
      BRANCHE: ${{ inputs.branche }}
      PROPRIETAIRE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.etiquette }}

      - name: Outils
        # La machine d'ARRSA les a dans son image (flatpak-builder, skopeo, jq) ; un exécuteur de GitHub les installe.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q flatpak flatpak-builder skopeo jq
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Construire
        # Runtime et SDK du manifeste pris sur Flathub ; pas de FUSE sur les exécuteurs GitHub.
        # Dossiers de travail hors du code : un manifeste qui copie son dépôt (source `dir`) les
        # emporterait sinon dans le paquet.
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --state-dir="$RUNNER_TEMP/etat" --default-branch="$BRANCHE" --repo="$RUNNER_TEMP/depot" \
            --force-clean "$RUNNER_TEMP/construction" "$MANIFESTE"

      - name: Emballer en OCI
        run: flatpak build-bundle --oci "$RUNNER_TEMP/depot" "$RUNNER_TEMP/paquet" "$APPLI" "$BRANCHE"

      - name: Pousser sur ghcr.io
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
          # Identifiants du passage dans son dossier : sur la machine, le jeton du job écraserait sinon
          # ~/.config/containers/auth.json de l'utilisateur (ghcr.io, image d'ARRSA).
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          image="ghcr.io/${PROPRIETAIRE,,}/$PAQUET"
          echo "$JETON" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          oci="$RUNNER_TEMP/paquet"
          ref=$(jq -r '.manifests[0].annotations["org.opencontainers.image.ref.name"]' "$oci/index.json")
          skopeo copy "oci:$oci:$ref" "docker://$image:latest"
          skopeo copy "oci:$oci:$ref" "docker://$image:${GITHUB_SHA::12}"
          echo "Publié : $image (le catalogue le verra à son prochain passage, 15 min au plus)."
