# Fiche d'identité d'un système (norme : ~/ARRSA/docs/systemes.md, « Fiche d'identité »). Seule
# source du code, du but, de l'état, des liens et des tests ; le Flatpak l'embarque (/app/share/arrsa).
[systeme]
code = "@CODE@"
nom = "@Nom@"
nature = "@NATURE@"     # instrument | autonome (socle : S0 seul)
but = "@BUT@"
naissance = "@DATE@"
etat = "actif"          # actif | pause | abandon | absorbe
absorbe_par = ""

[liens]
depend_de = []          # codes sans lesquels il ne marche pas ("S0" = l'API d'ARRSA)
utilise = []            # codes dont il se sert s'ils sont là

[tests]
commandes = ["uv run pytest -q"]   # lancées depuis la racine, chacune doit passer
