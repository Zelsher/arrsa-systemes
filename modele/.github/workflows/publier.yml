# Publier @Nom@ dans le catalogue des systèmes d'ARRSA (ADR 0140 d'ARRSA, dépôt Zelsher/arrsa-systemes) :
# Flatpak construit et poussé en image privée ghcr.io/zelsher/systemes-@nom@, que l'index lisent les
# machines. À chaque étiquette de version (v0.2.0…), ou à la main (onglet Actions, « Publier » du hangar).
name: Publier

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    uses: Zelsher/arrsa-systemes/.github/workflows/publier.yml@main
    permissions:
      contents: read
      packages: write
    with:
      manifeste: paquet/org.arrsa.@Nom@.yml
      appli: org.arrsa.@Nom@
      paquet: systemes-@nom@
